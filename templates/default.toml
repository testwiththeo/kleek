# kleek default profile
# Location: ~/.config/kleek/config.toml

[sensor]
# Hardware DPI resolution
dpi = 1600
# Polling rate in Hz (125, 250, 500, 1000)
polling_rate = 1000

[pointer]
# "flat" removes pointer acceleration curve (1:1 raw tracking, LinearMouse style)
accel_profile = "flat"

[scroll]
# Enable fluid, momentum-based scrolling
smooth = true
# Invert vertical scroll direction (natural macOS style)
natural_direction = true
# Virtual scroll speed step size
step_size = 30.0
# Momentum decay duration in seconds (responsive stop)
duration = 0.24
# Acceleration multiplier under rapid flicking
max_gain = 2.0
# Travel speed multiplier
speed = 1.2

[apps]
# Applications where smooth momentum scrolling is bypassed (direct 1:1 notch)
exclude = ["blender", "steam", "factorio", "freecad", "kicad"]
