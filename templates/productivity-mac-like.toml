# kleek productivity profile
# Mac-like fluid inertia scrolling with high-resolution steps

[sensor]
# Balanced office sensor tracking for standard optical sensors
dpi = 1000
polling_rate = 500

[pointer]
# "flat" removes pointer acceleration curve (1:1 raw tracking, LinearMouse / Mac feel)
accel_profile = "flat"

[scroll]
# Ultra-smooth glide physics
smooth = true
natural_direction = true
# Micro-steps for discrete office mouse notched wheels (eliminates stepping stutters)
step_size = 28.0
# Momentum decay for gentle, controlled glide
duration = 0.25
# Controlled flick gain for natural acceleration
max_gain = 1.25
# Calibrated travel speed — soft, fluid Mac-like scrolling (Mos 33.6px calibrated)
speed = 0.40

[apps]
# Applications where smooth momentum scrolling is bypassed (direct 1:1 notch)
exclude = ["blender", "steam", "factorio", "freecad", "kicad"]

[gestures]
# Mac Mouse Fix side button gestures: "workspace", "volume", "tab", "disabled"
side_scroll = "workspace"
