# kleek productivity profile
# Mac-like fluid inertia scrolling with high-resolution steps

[sensor]
# Balanced office sensor tracking for standard optical sensors
dpi = 1000
polling_rate = 500

[pointer]
# "flat" removes pointer acceleration curve (1:1 raw tracking, LinearMouse / Mac feel)
accel_profile = "flat"

[scroll]
# Ultra-smooth glide physics
smooth = true
natural_direction = true
# Micro-steps for discrete office mouse notched wheels (eliminates stepping stutters)
step_size = 35.0
# Extended deceleration curve for premium gliding feel
duration = 0.48
# Adaptive speed multiplier under fast wheel flicking
max_gain = 4.8
# Travel speed multiplier (Mos / LinearMouse style)
speed = 3.6
