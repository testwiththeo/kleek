[package]
name = "kleek-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Command-line control interface (kleekctl) for the kleek mouse daemon"

[lib]
name = "kleek_cli"
path = "src/lib.rs"

[[bin]]
name = "kleekctl"
path = "src/main.rs"

[dependencies]
kleek-proto = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
colored = { workspace = true }
zbus = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

[dev-dependencies]

[package.metadata.deb]
name = "kleek"
maintainer = "Theodorus Yosia <theodorusyosia15@gmail.com>"
copyright = "2026 Theodorus Yosia"
license-file = ["../../LICENSE-MIT", "4"]
depends = "$auto, libudev1"
section = "utils"
priority = "optional"
extended-description = """\
A lightweight, userspace mouse companion daemon and CLI for Linux.
Provides smooth momentum-based scrolling and DPI hardware configuration."""
assets = [
    ["../../target/release/kleekctl", "usr/bin/kleekctl", "755"],
    ["../../target/release/kleek-daemon", "usr/bin/kleek-daemon", "755"],
    ["../../udev/99-kleek.rules", "lib/udev/rules.d/99-kleek.rules", "644"],
    ["../../systemd/kleek.service", "usr/lib/systemd/user/kleek.service", "644"],
    ["../../xdg/kleek.desktop", "etc/xdg/autostart/kleek.desktop", "644"],
    ["../../templates/default.toml", "usr/share/kleek/templates/default.toml", "644"],
    ["../../templates/gaming.toml", "usr/share/kleek/templates/gaming.toml", "644"],
    ["../../templates/productivity-mac-like.toml", "usr/share/kleek/templates/productivity.toml", "644"],
    ["../../README.md", "usr/share/doc/kleek/README.md", "644"],
]
maintainer-scripts = "../../debian"
